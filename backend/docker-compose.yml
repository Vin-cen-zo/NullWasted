name: nullwasted

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nullwasted_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8016:8016"
    volumes:
      - ./static/uploads:/app/static/uploads
    networks:
      - nullwasted_network
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nullwasted_network:
    name: nullwasted_network
    driver: bridge
